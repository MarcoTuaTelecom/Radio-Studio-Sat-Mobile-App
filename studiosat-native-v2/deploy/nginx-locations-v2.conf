# Studio Sat Native V2 - conteúdo inserido no server{} de www.radio.studiosatweb.com.br

location ^~ /listen-v2/ {
    alias /var/www/studiosat-v2/listen/;
    try_files $uri $uri/ /listen-v2/index.html;

    add_header Cache-Control "no-store" always;
    add_header X-StudioSat-Portal "native-v2" always;
}

location ^~ /api/v2/ {
    proxy_pass http://127.0.0.1:9080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
}
