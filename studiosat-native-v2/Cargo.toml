[workspace]
resolver = "2"
members = [
  "rust/core",
  "rust/api",
  "web"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["Studio Sat Web"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
