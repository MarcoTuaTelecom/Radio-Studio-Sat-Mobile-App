name: StudioSat
options:
  bundleIdPrefix: br.com.studiosatweb
  deploymentTarget:
    iOS: "17.0"
targets:
  StudioSat:
    type: application
    platform: iOS
    sources:
      - StudioSat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.studiosatweb.radio.v2
        SWIFT_VERSION: 6.0
        INFOPLIST_FILE: StudioSat/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: StudioSat/Info.plist
      properties:
        CFBundleDisplayName: Rádio Sat V2
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
