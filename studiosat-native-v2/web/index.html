<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b13">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Rádio Sat V2</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">Carregando Rádio Sat V2...</div>

  <!-- Elemento de mídia real. O Rust apenas controla estado/UI. -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"
          crossorigin="anonymous"></script>
  <script src="./media-bridge.js"></script>

  <script type="module">
    import init from "./pkg/studiosat_web.js";
    init().catch(error => {
      console.error("Falha ao iniciar Studio Sat V2", error);
      document.getElementById("app").textContent = "Falha ao carregar o portal V2.";
    });
  </script>
</body>
</html>
