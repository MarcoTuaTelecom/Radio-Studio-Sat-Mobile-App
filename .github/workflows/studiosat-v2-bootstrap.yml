name: Bootstrap Studio Sat Native V2

on:
  push:
    branches:
      - feature/studiosat-native-v2
    paths:
      - ".bootstrap/studiosat-v2-v0.1.0.tar.gz"
      - "scripts/expand-studiosat-v2-bootstrap.sh"
      - ".github/workflows/studiosat-v2-bootstrap.yml"

permissions:
  contents: write

jobs:
  expand:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/studiosat-native-v2
          fetch-depth: 0

      - name: Expand source tree
        run: bash scripts/expand-studiosat-v2-bootstrap.sh

      - name: Commit expanded V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Studio Sat Native V2 source, apps and documentation"
          git push origin HEAD:feature/studiosat-native-v2
