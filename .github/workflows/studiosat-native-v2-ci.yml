name: Studio Sat Native V2

on:
  workflow_dispatch:
  push:
    paths:
      - "studiosat-native-v2/**"
  pull_request:
    paths:
      - "studiosat-native-v2/**"

jobs:
  rust-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studiosat-native-v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check -p studiosat-core
      - run: cargo check -p studiosat-api
      - run: cargo check -p studiosat-web --target wasm32-unknown-unknown
      - run: bash scripts/validate.sh

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studiosat-native-v2/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle :app:assembleDebug

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: studiosat-native-v2/ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild \
            -project StudioSat.xcodeproj \
            -scheme StudioSat \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
